<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kira — Public Kiosk</title>
<script>try { if (localStorage.getItem('kira-kiosk-theme') === 'light') document.documentElement.classList.add('theme-light'); } catch (e) {}</script>
<link rel="stylesheet" href="../shared/tokens.css?v=3">
<link rel="stylesheet" href="../shared/proto.css?v=3">
<link rel="stylesheet" href="../shared/tablet.css?v=1">
<style>
  /* =====================================================================
     Public kiosk (hall tablet): the guest tablet's components, minus anything
     room-specific. Home = Kira 60% | places 40%; a place opens directions on
     the 3D map (60%) with the steps beside it (40%).
     ===================================================================== */

  /* Top bar: where this kiosk stands */
  .nav-where { display: inline-flex; align-items: center; gap: 6px; }
  .nav-where svg { width: 16px; height: 16px; flex-shrink: 0; color: var(--brass-soft); }

  /* Home: questions people often ask, as one swipeable row */
  .ask-row .quick-chip { flex-shrink: 0; white-space: nowrap; scroll-snap-align: start; }
  .tablet-body.bento-home .ai-home .avatar-sub { max-width: 380px; line-height: 1.4; }

  /* Home: where would you like to go? */
  .place-grid { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: minmax(min-content, 1fr); gap: calc(10px * (2.2 - var(--ts)) / 1.2); overflow-y: auto; overflow-x: hidden; scrollbar-width: none; }
  .place-tile {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-width: 0; padding: 10px 8px;
    border: none; border-radius: 20px; background: rgba(255,255,255,.05); color: var(--ink-on-dark); font-family: inherit; text-align: center; cursor: pointer;
    transition: background-color .2s, transform .14s cubic-bezier(.3,.7,.4,1.4);
  }
  .place-tile:hover { background: rgba(255,255,255,.1); }
  .place-tile:active { background: rgba(255,255,255,.14); transform: scale(.97); }
  .place-tile img { width: calc(42px * (2.2 - var(--ts)) / 1.2); height: auto; filter: drop-shadow(0 6px 8px rgba(0,0,0,.35)); }
  .place-tile .name { font-size: calc(14.5px * var(--ts, 1)); font-weight: 500; line-height: 1.2; }
  .place-tile .info { font-size: calc(12px * var(--ts, 1)); line-height: 1.3; color: var(--muted-on-dark); }
  .all-row { flex-shrink: 0; }
  .bento.swap .place-grid > * { animation: rise-in .5s cubic-bezier(.22,.9,.24,1) both; }
  .bento.swap .place-grid > :nth-child(2n+1) { animation-delay: .2s; } .bento.swap .place-grid > :nth-child(2n) { animation-delay: .26s; }
  .bento.swap .place-grid > :nth-child(n+3) { animation-delay: .32s; } .bento.swap .place-grid > :nth-child(n+5) { animation-delay: .38s; }
  html.theme-light .place-tile { background: rgba(19,19,19,.045); }
  html.theme-light .place-tile:hover { background: rgba(19,19,19,.08); }
  html.theme-light .place-tile img { filter: drop-shadow(0 6px 8px rgba(60,40,120,.2)); }

  /* Directions: the 3D map fills the left panel */
  .status-detail.map-card { padding: 0; position: relative; overflow: hidden; justify-content: stretch; }
  .map-slot { position: absolute; inset: 0; }
  .map3d { position: absolute; inset: 0; touch-action: none; cursor: grab; }
  .map3d:active { cursor: grabbing; }
  .map3d canvas { display: block; }
  .map-labels { position: absolute !important; inset: 0; pointer-events: none; }
  .map-labels > * { pointer-events: none; }
  .map-label {
    font: 500 calc(11px * var(--ts, 1))/1 var(--font); color: var(--ink-on-dark); white-space: nowrap;
    padding: 5px 9px; border-radius: 999px; background: rgba(26,24,30,.72); box-shadow: 0 4px 12px -6px rgba(0,0,0,.6);
  }
  .map-label.dest { display: flex; align-items: center; gap: 6px; padding: 5px 12px 5px 5px; font-size: calc(13px * var(--ts, 1)); background: #8C4EF6; color: #FFFFFF; box-shadow: 0 10px 24px -8px rgba(140,78,246,.85); }
  .map-label.dest img { width: 24px; height: 24px; }
  .map-here { display: flex; align-items: center; gap: 6px; padding: 5px 10px 5px 7px; border-radius: 999px; font: 600 calc(11px * var(--ts, 1))/1 var(--font); white-space: nowrap; background: #4ADE80; color: #052E16; box-shadow: 0 6px 16px -6px rgba(74,222,128,.7); }
  .map-here i { width: 8px; height: 8px; border-radius: 50%; background: #052E16; }
  .map-floor { display: flex; align-items: baseline; gap: 6px; padding-right: 8px; white-space: nowrap; font: 500 calc(11px * var(--ts, 1))/1 var(--font); color: var(--muted-on-dark); transition: opacity .4s; }
  .map-floor b { font-size: calc(18px * var(--ts, 1)); font-weight: 500; color: var(--ink-on-dark); }
  .map-floor.dim { opacity: .3; }
  .map-floor.ghost { opacity: .55; font-size: calc(10.5px * var(--ts, 1)); }
  .map-hint {
    position: absolute; left: 14px; bottom: 14px; display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 999px;
    font-size: calc(12px * var(--ts, 1)); color: var(--muted-on-dark); background: rgba(26,24,30,.6); pointer-events: none; transition: opacity .5s;
  }
  .map-hint svg { width: 15px; height: 15px; }
  .map-card:has(.map3d.touched) .map-hint { opacity: 0; }
  .map-replay { position: absolute; right: 14px; bottom: 14px; z-index: 1; }
  .map-replay svg { width: 17px; height: 17px; }
  .map-fallback { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 32px; text-align: center; font-size: calc(14px * var(--ts, 1)); line-height: 1.5; color: var(--muted-on-dark); }
  html.theme-light .map-label { background: rgba(255,255,255,.9); color: #131313; box-shadow: 0 4px 12px -6px rgba(60,40,120,.35); }
  html.theme-light .map-label.dest { background: #8C4EF6; color: #FFFFFF; }
  html.theme-light .map-hint { background: rgba(255,255,255,.8); }

  /* Directions: details and steps on the right */
  .status-actions.is-summary.dir-side { gap: 8px; padding: 20px; }
  .dir-side .side-cta { padding-top: 4px; }
  .status-split.fill { grid-template-rows: minmax(0, 1fr); }
  .status-split.fill > .dir-side { min-height: 0; overflow: hidden; }
  .dir-head { display: flex; align-items: center; gap: 12px; }
  .dir-head img { width: calc(46px * (2.2 - var(--ts)) / 1.2); height: auto; flex-shrink: 0; filter: drop-shadow(0 8px 10px rgba(0,0,0,.35)); }
  .dir-floor { font-size: calc(13px * var(--ts, 1)); color: var(--muted-on-dark); margin-top: 2px; }
  .dir-facts { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: calc(13.5px * var(--ts, 1)); color: var(--muted-on-dark); }
  .dir-facts b { color: var(--ink-on-dark); font-weight: 500; }
  .open-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: #4ADE80; box-shadow: 0 0 8px rgba(74,222,128,.7); }
  .open-dot.off { background: rgba(255,255,255,.3); box-shadow: none; }
  .dir-steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; min-height: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: thin; }
  .dir-step { display: flex; align-items: flex-start; gap: 10px; padding: 6px 10px 6px 8px; border-radius: 14px; font-size: calc(14px * var(--ts, 1)); line-height: 1.38; color: var(--muted-on-dark); transition: background-color .35s, color .35s; }
  .dir-step .n { flex-shrink: 0; width: 24px; height: 24px; margin-top: -1px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: calc(12.5px * var(--ts, 1)); font-weight: 500; background: rgba(255,255,255,.09); color: var(--ink-on-dark); transition: background-color .35s, color .35s; }
  .dir-step.on { background: rgba(140,78,246,.18); color: var(--ink-on-dark); }
  .dir-step.on .n { background: var(--brass); color: #FFFFFF; }
  .dir-side .btn-row { margin-top: 0; }
  html.theme-light .open-dot { background: #16A34A; box-shadow: none; }
  html.theme-light .open-dot.off { background: rgba(19,19,19,.25); }
  html.theme-light .dir-step .n { background: rgba(19,19,19,.07); }
  html.theme-light .dir-step.on { background: #EFE7FD; }
  html.theme-light .dir-step.on .n { background: #5B2BB8; }
  html.theme-light .dir-head img { filter: drop-shadow(0 8px 10px rgba(60,40,120,.22)); }

  /* All places: grouped by floor */
  .places-list { display: flex; flex-direction: column; gap: 6px; min-height: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: thin; scrollbar-color: rgba(196,166,255,.3) transparent; }
  .places-floor { display: flex; align-items: center; gap: 10px; margin: 12px 0 2px; font-size: calc(13px * var(--ts, 1)); color: var(--muted-on-dark); }
  .places-floor:first-child { margin-top: 0; }
  .floor-badge { min-width: 30px; height: 30px; padding: 0 7px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; background: rgba(140,78,246,.24); color: var(--ink-on-dark); font-size: calc(13px * var(--ts, 1)); font-weight: 500; }
  .place-row { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; padding: 8px 14px 8px 10px; border: none; border-radius: 16px; background: rgba(255,255,255,.05); color: var(--ink-on-dark); font-family: inherit; text-align: left; cursor: pointer; transition: background-color .2s; }
  .place-row:hover { background: rgba(255,255,255,.1); }
  .place-row:active { background: rgba(255,255,255,.14); }
  .place-row img { width: calc(36px * (2.2 - var(--ts)) / 1.2); height: auto; flex-shrink: 0; filter: drop-shadow(0 4px 6px rgba(0,0,0,.35)); }
  .place-row .svc-text .name { font-size: calc(15px * var(--ts, 1)); font-weight: 500; }
  .place-row .svc-text .info { font-size: calc(12.5px * var(--ts, 1)); line-height: 1.35; color: var(--muted-on-dark); }
  .place-open { margin-left: auto; flex-shrink: 0; font-size: calc(12px * var(--ts, 1)); color: var(--muted-on-dark); white-space: nowrap; }
  .floor-guide { display: flex; flex-direction: column; gap: 10px; }
  .floor-guide > div { display: flex; align-items: center; gap: 12px; font-size: calc(14px * var(--ts, 1)); line-height: 1.35; }
  .floor-guide span:last-child { color: var(--muted-on-dark); }
  .floor-guide b { color: var(--ink-on-dark); font-weight: 500; }
  html.theme-light .place-row { background: rgba(19,19,19,.045); }
  html.theme-light .place-row:hover { background: rgba(19,19,19,.08); }
  html.theme-light .floor-badge { background: #E9DEFB; color: #5B2BB8; }
  html.theme-light .place-row img { filter: drop-shadow(0 4px 6px rgba(60,40,120,.2)); }

  /* Talk to Kira: an answer can come with "Show me the way" */
  .answer-card { display: flex; align-items: center; gap: 12px; padding: 10px 14px 10px 10px; border-radius: 18px; background: var(--glass); box-shadow: var(--glass-edge), 0 12px 30px -20px rgba(0,0,0,.8); }
  .answer-card img { width: calc(44px * (2.2 - var(--ts)) / 1.2); height: auto; flex-shrink: 0; filter: drop-shadow(0 6px 8px rgba(0,0,0,.35)); }
  .answer-card .name { font-size: calc(16px * var(--ts, 1)); font-weight: 500; }
  .answer-card .info { font-size: calc(13px * var(--ts, 1)); color: var(--muted-on-dark); margin-top: 2px; }
  html.theme-light .answer-card { box-shadow: var(--glass-edge), 0 10px 26px -16px rgba(60,40,120,.3); }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body class="guest-app">
  <div class="stage" id="stage">
    <div class="tablet-frame app" id="tablet">
      <div class="tablet-navbar">
        <div class="nav-group">
          <span class="nav-room nav-where" id="where-chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg><span id="where-text"></span></span>
          <span class="nav-weather" id="nav-weather" role="status"><span class="wx-time" id="wx-time"></span><img id="wx-icon" alt="" width="28" height="28"><span id="wx-temp"></span></span>
          <button class="nav-btn" id="lang-btn" aria-haspopup="dialog" aria-label="Language: English"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>EN</button>
        </div>
        <div class="nav-group">
          <button class="nav-btn nav-icon-only" id="theme-btn"></button>
          <div class="vol" id="vol" role="group" aria-label="Volume">
            <button class="nav-btn nav-icon-only vol-btn" id="vol-btn" aria-expanded="false" aria-controls="vol-panel"></button>
            <div class="vol-panel" id="vol-panel">
              <input type="range" class="vol-range" id="vol-range" min="0" max="100" step="1" aria-label="Kira volume">
              <button class="vol-mute" id="mute-btn" aria-pressed="false"></button>
            </div>
          </div>
          <span class="nav-seg" role="group" aria-label="Text size"><button class="nav-btn" id="text-down" aria-label="Smaller text"><span class="a-sm">A</span>−</button><button class="nav-btn" id="text-up" aria-label="Larger text"><span class="a-lg">A</span>+</button></span>
          <button class="nav-btn nav-help" id="help-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/><path d="m4.93 4.93 4.24 4.24M14.83 14.83l4.24 4.24M14.83 9.17l4.24-4.24M4.93 19.07l4.24-4.24"/></svg><span class="help-long">Help / Emergency</span><span class="help-short">Help</span></button>
        </div>
      </div>
      <div class="tablet-context" id="context"></div>
      <div class="tablet-body" id="body"></div>
      <div id="overlay"></div>
    </div>
  </div>
  <p class="rotate-hint">Rotate your phone for a bigger tablet view</p>
<script src="../shared/kira.js?v=5"></script>
<script src="hotel-map.js?v=2"></script>
<script src="public.js?v=5"></script>
<script type="module" src="map3d.js?v=8"></script>
</body>
</html>
