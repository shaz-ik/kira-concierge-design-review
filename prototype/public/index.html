<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kira — Public Kiosk</title>
<script>try { if (localStorage.getItem('kira-kiosk-theme') === 'light') document.documentElement.classList.add('theme-light'); } catch (e) {}</script>
<link rel="stylesheet" href="../shared/tokens.css?v=3">
<link rel="stylesheet" href="../shared/proto.css?v=3">
<link rel="stylesheet" href="../shared/tablet.css?v=1">
<style>
  /* =====================================================================
     Public kiosk (hall tablet): the guest tablet's components, minus anything
     room-specific. Home is one full-width welcome — Talk to Kira, plus shortcuts
     to Find a place and Hotel info. A place opens directions on the 3D map (60%)
     with the steps beside it (40%).
     ===================================================================== */

  /* No top bar on the kiosk: the panels take the whole screen. Where / time / weather, language
     and Help sit at the top of the welcome; every other screen keeps Help in its header. */
  .tablet-body.bento-home { padding: 0; }
  .tablet-frame.app::before, .tablet-frame.app::after { display: none; }
  .tablet-body.bento-home.mode-service .bento-services { padding: 20px 24px 24px; }
  .welcome-top { position: absolute; z-index: 2; top: 22px; left: 28px; right: 22px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .kiosk-status { display: flex; align-items: center; gap: 16px; font-size: calc(14px * var(--ts, 1)); font-weight: 500; color: var(--ink-on-dark); white-space: nowrap; }
  .kiosk-status .where { display: inline-flex; align-items: center; gap: 6px; color: var(--muted-on-dark); }
  .kiosk-status .where svg { width: 16px; height: 16px; color: var(--brass-soft); }
  .kiosk-status .time { color: var(--muted-on-dark); }
  .kiosk-status .wx { display: inline-flex; align-items: center; gap: 6px; }
  .kiosk-status .wx img { width: 26px; height: 26px; filter: drop-shadow(0 3px 5px rgba(0,0,0,.35)); }
  .welcome-actions { display: flex; gap: 8px; }
  .welcome-actions .nav-btn { font-size: calc(14px * var(--ts, 1)); }
  .help-mini { margin-left: 4px; flex-shrink: 0; }
  .panel-head .panel-title + .help-mini { margin-left: auto; }

  /* Welcome: the Kira panel fills the screen; drifting glows and the Marina skyline behind */
  .tablet-body.bento-home .bento-ai:has(.welcome) { padding: 0; background: var(--glass); }
  .welcome { position: absolute; inset: 0; overflow: hidden; border-radius: inherit; }
  .welcome-bg { position: absolute; inset: 0; pointer-events: none; }
  .orb { position: absolute; border-radius: 50%; filter: blur(60px); opacity: .55; animation: drift 22s ease-in-out infinite alternate; }
  .orb.o1 { width: 420px; height: 420px; left: 46%; top: -18%; background: radial-gradient(circle, rgba(140,78,246,.9), transparent 70%); }
  .orb.o2 { width: 340px; height: 340px; left: 70%; top: 22%; background: radial-gradient(circle, rgba(94,161,243,.7), transparent 70%); animation-duration: 27s; animation-delay: -8s; }
  .orb.o3 { width: 300px; height: 300px; left: 30%; top: 48%; background: radial-gradient(circle, rgba(201,179,247,.55), transparent 70%); animation-duration: 31s; animation-delay: -15s; }
  @keyframes drift { 0% { transform: translate(0, 0) scale(1); } 50% { transform: translate(-40px, 26px) scale(1.08); } 100% { transform: translate(30px, -18px) scale(.95); } }
  .skyline { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 44%; }
  .skyline .far { fill: rgba(196,166,255,.07); }
  .skyline .near { fill: rgba(196,166,255,.12); }
  .skyline .water { fill: rgba(140,78,246,.1); }
  .skyline .shimmer { stroke: rgba(196,166,255,.35); stroke-width: 2; stroke-linecap: round; stroke-dasharray: 26 18; animation: shimmer 6s linear infinite; }
  @keyframes shimmer { to { stroke-dashoffset: -88; } }
  html.theme-light .orb { opacity: .4; }
  html.theme-light .skyline .far { fill: rgba(140,78,246,.08); }
  html.theme-light .skyline .near { fill: rgba(140,78,246,.13); }
  html.theme-light .skyline .water { fill: rgba(140,78,246,.07); }
  html.theme-light .skyline .shimmer { stroke: rgba(140,78,246,.3); }
  @media (prefers-reduced-motion: reduce) { .orb, .skyline .shimmer { animation: none; } }

  .welcome-copy { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 72px 40px 40px; text-align: center; }
  .welcome-copy .kira-photo-wrap { width: calc(132px * (2.2 - var(--ts)) / 1.2); }
  .welcome-copy .home-greeting { margin-top: 18px; font-size: calc(34px * var(--ts, 1)); }
  .welcome-copy .avatar-sub { margin-top: 6px; max-width: 560px; text-wrap: balance; font-size: calc(16px * var(--ts, 1)); line-height: 1.45; color: var(--muted-on-dark); }
  .welcome-copy .talk-btn { margin-top: 22px; min-height: 52px; padding: 0 30px; }
  .shortcuts { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 16px; }
  /* shortcuts: solid filled buttons (not glass) — icon + name only */
  .shortcut {
    display: flex; align-items: center; justify-content: center; gap: 12px; min-width: 220px; min-height: 72px; padding: 16px 24px;
    border: none; border-radius: var(--radius-guest-sm); background: #2E2838; box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 12px 28px -14px rgba(0,0,0,.8);
    color: #FFFFFF; font-family: inherit; cursor: pointer; transition: background-color .2s, transform .14s cubic-bezier(.3,.7,.4,1.4);
  }
  .shortcut:hover { background: #383143; }
  .shortcut:active { transform: scale(.97); }
  .shortcut img { width: calc(36px * (2.2 - var(--ts)) / 1.2); height: auto; flex-shrink: 0; filter: drop-shadow(0 4px 6px rgba(0,0,0,.35)); }
  .shortcut .name { font-size: calc(16px * var(--ts, 1)); font-weight: 500; }
  html.theme-light .shortcut { background: #FFFFFF; color: #131313; box-shadow: 0 10px 26px -14px rgba(60,40,120,.35); }
  html.theme-light .shortcut:hover { background: #F4EFFD; }
  html.theme-light .shortcut img { filter: drop-shadow(0 6px 8px rgba(60,40,120,.2)); }
  .bento.swap .welcome-copy > * { animation: rise-in .55s cubic-bezier(.22,.9,.24,1) both; }
  .bento.swap .welcome-copy > :nth-child(1) { animation-delay: .18s; } .bento.swap .welcome-copy > :nth-child(2) { animation-delay: .24s; }
  .bento.swap .welcome-copy > :nth-child(3) { animation-delay: .29s; } .bento.swap .welcome-copy > :nth-child(4) { animation-delay: .34s; }
  .bento.swap .welcome-copy > :nth-child(5) { animation-delay: .4s; }

  /* Find a place: floor filter + tiles */
  .place-filter { flex-shrink: 0; display: flex; flex-wrap: wrap; gap: 8px; }
  .place-filter .quick-chip { flex-shrink: 0; white-space: nowrap; }
  .place-grid { flex: 0 1 auto; min-height: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-auto-rows: minmax(104px, auto); align-content: start; gap: 10px; overflow-y: auto; overflow-x: hidden; scrollbar-width: thin; scrollbar-color: rgba(196,166,255,.3) transparent; }
  .place-tile {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-width: 0; padding: 10px 8px;
    border: none; border-radius: 20px; background: rgba(255,255,255,.05); color: var(--ink-on-dark); font-family: inherit; text-align: center; cursor: pointer;
    transition: background-color .2s, transform .14s cubic-bezier(.3,.7,.4,1.4);
  }
  .place-tile:hover { background: rgba(255,255,255,.1); }
  .place-tile:active { background: rgba(255,255,255,.14); transform: scale(.97); }
  .place-tile img { width: calc(42px * (2.2 - var(--ts)) / 1.2); height: auto; filter: drop-shadow(0 6px 8px rgba(0,0,0,.35)); }
  .place-tile .name { font-size: calc(14.5px * var(--ts, 1)); font-weight: 500; line-height: 1.2; }
  .place-tile .info { font-size: calc(12px * var(--ts, 1)); line-height: 1.3; color: var(--muted-on-dark); }
  html.theme-light .place-tile { background: rgba(19,19,19,.045); }
  html.theme-light .place-tile:hover { background: rgba(19,19,19,.08); }
  html.theme-light .place-tile img { filter: drop-shadow(0 6px 8px rgba(60,40,120,.2)); }

  /* Hotel info: topics as a two-column list; the chosen one is filled */
  .topic-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; align-content: start; min-height: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: thin; scrollbar-color: rgba(196,166,255,.3) transparent; }
  .topic-row { display: flex; align-items: center; gap: 10px; min-width: 0; min-height: 56px; padding: 8px 12px 8px 8px; border: none; border-radius: 16px; background: rgba(255,255,255,.05); color: var(--ink-on-dark); font-family: inherit; text-align: left; cursor: pointer; transition: background-color .2s; }
  .topic-row:hover { background: rgba(255,255,255,.1); }
  .topic-row.selected { background: rgba(140,78,246,.28); }
  .topic-row img { width: calc(32px * (2.2 - var(--ts)) / 1.2); height: auto; flex-shrink: 0; filter: drop-shadow(0 4px 6px rgba(0,0,0,.35)); }
  .topic-row .svc-text { min-width: 0; }
  .topic-row .name { font-size: calc(14px * var(--ts, 1)); font-weight: 500; line-height: 1.25; }
  .topic-row .info { font-size: calc(12px * var(--ts, 1)); line-height: 1.3; color: var(--muted-on-dark); }
  .topic-answer { font-size: calc(15px * var(--ts, 1)); line-height: 1.55; color: var(--ink-on-dark); }
  .topic-answer.muted { color: var(--muted-on-dark); }
  .status-split.fill > .info-side { min-height: 0; overflow-y: auto; }
  html.theme-light .topic-row { background: rgba(19,19,19,.045); }
  html.theme-light .topic-row:hover { background: rgba(19,19,19,.08); }
  html.theme-light .topic-row.selected { background: #EFE7FD; }
  html.theme-light .topic-row img { filter: drop-shadow(0 4px 6px rgba(60,40,120,.2)); }

  /* Directions: the 3D map fills the left panel */
  .status-detail.map-card { padding: 0; position: relative; overflow: hidden; justify-content: stretch; }
  .map-slot { position: absolute; inset: 0; }
  .map3d { position: absolute; inset: 0; touch-action: none; cursor: grab; }
  .map3d:active { cursor: grabbing; }
  .map3d canvas { display: block; }
  .map-labels { position: absolute !important; inset: 0; pointer-events: none; }
  .map-labels > * { pointer-events: none; }
  .map-label {
    font: 500 calc(11px * var(--ts, 1))/1 var(--font); color: var(--ink-on-dark); white-space: nowrap;
    padding: 5px 9px; border-radius: 999px; background: rgba(26,24,30,.72); box-shadow: 0 4px 12px -6px rgba(0,0,0,.6);
  }
  .map-label.dest { display: flex; align-items: center; gap: 6px; padding: 5px 12px 5px 5px; font-size: calc(13px * var(--ts, 1)); background: #8C4EF6; color: #FFFFFF; box-shadow: 0 10px 24px -8px rgba(140,78,246,.85); }
  .map-label.dest img { width: 24px; height: 24px; }
  .map-here { display: flex; align-items: center; gap: 6px; padding: 5px 10px 5px 7px; border-radius: 999px; font: 600 calc(11px * var(--ts, 1))/1 var(--font); white-space: nowrap; background: #4ADE80; color: #052E16; box-shadow: 0 6px 16px -6px rgba(74,222,128,.7); }
  .map-here i { width: 8px; height: 8px; border-radius: 50%; background: #052E16; }
  .map-floor { display: flex; align-items: baseline; gap: 6px; padding-right: 8px; white-space: nowrap; font: 500 calc(11px * var(--ts, 1))/1 var(--font); color: var(--muted-on-dark); transition: opacity .4s; }
  .map-floor b { font-size: calc(18px * var(--ts, 1)); font-weight: 500; color: var(--ink-on-dark); }
  .map-floor.dim { opacity: .3; }
  .map-floor.ghost { opacity: .55; font-size: calc(10.5px * var(--ts, 1)); }
  .map-hint {
    position: absolute; left: 14px; bottom: 14px; display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 999px;
    font-size: calc(12px * var(--ts, 1)); color: var(--muted-on-dark); background: rgba(26,24,30,.6); pointer-events: none; transition: opacity .5s;
  }
  .map-hint svg { width: 15px; height: 15px; }
  .map-card:has(.map3d.touched) .map-hint { opacity: 0; }
  .map-replay { position: absolute; right: 14px; bottom: 14px; z-index: 1; }
  .map-replay svg { width: 17px; height: 17px; }
  .map-fallback { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 32px; text-align: center; font-size: calc(14px * var(--ts, 1)); line-height: 1.5; color: var(--muted-on-dark); }
  html.theme-light .map-label { background: rgba(255,255,255,.9); color: #131313; box-shadow: 0 4px 12px -6px rgba(60,40,120,.35); }
  html.theme-light .map-label.dest { background: #8C4EF6; color: #FFFFFF; }
  html.theme-light .map-hint { background: rgba(255,255,255,.8); }

  /* Directions: details and steps on the right */
  .status-actions.is-summary.dir-side { gap: 8px; padding: 20px; }
  .dir-side .side-cta { padding-top: 4px; }
  .status-split.fill { grid-template-rows: minmax(0, 1fr); }
  .status-split.fill > .dir-side { min-height: 0; overflow: hidden; }
  .dir-head { display: flex; align-items: center; gap: 12px; }
  .dir-head img { width: calc(46px * (2.2 - var(--ts)) / 1.2); height: auto; flex-shrink: 0; filter: drop-shadow(0 8px 10px rgba(0,0,0,.35)); }
  .dir-floor { font-size: calc(13px * var(--ts, 1)); color: var(--muted-on-dark); margin-top: 2px; }
  .dir-facts { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: calc(13.5px * var(--ts, 1)); color: var(--muted-on-dark); }
  .dir-facts b { color: var(--ink-on-dark); font-weight: 500; }
  .open-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: #4ADE80; box-shadow: 0 0 8px rgba(74,222,128,.7); }
  .open-dot.off { background: rgba(255,255,255,.3); box-shadow: none; }
  .dir-steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; min-height: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: thin; }
  .dir-step { display: flex; align-items: flex-start; gap: 10px; padding: 6px 10px 6px 8px; border-radius: 14px; font-size: calc(14px * var(--ts, 1)); line-height: 1.38; color: var(--muted-on-dark); transition: background-color .35s, color .35s; }
  .dir-step .n { flex-shrink: 0; width: 24px; height: 24px; margin-top: -1px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: calc(12.5px * var(--ts, 1)); font-weight: 500; background: rgba(255,255,255,.09); color: var(--ink-on-dark); transition: background-color .35s, color .35s; }
  .dir-step.on { background: rgba(140,78,246,.18); color: var(--ink-on-dark); }
  .dir-step.on .n { background: var(--brass); color: #FFFFFF; }
  .dir-side .btn-row { margin-top: 0; }
  html.theme-light .open-dot { background: #16A34A; box-shadow: none; }
  html.theme-light .open-dot.off { background: rgba(19,19,19,.25); }
  html.theme-light .dir-step .n { background: rgba(19,19,19,.07); }
  html.theme-light .dir-step.on { background: #EFE7FD; }
  html.theme-light .dir-step.on .n { background: #5B2BB8; }
  html.theme-light .dir-head img { filter: drop-shadow(0 8px 10px rgba(60,40,120,.22)); }

  /* Hotel guide (beside Find a place) */
  .floor-badge { min-width: 30px; height: 30px; padding: 0 7px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; background: rgba(140,78,246,.24); color: var(--ink-on-dark); font-size: calc(13px * var(--ts, 1)); font-weight: 500; }
  .floor-guide { display: flex; flex-direction: column; gap: 10px; }
  .floor-guide > div { display: flex; align-items: center; gap: 12px; font-size: calc(14px * var(--ts, 1)); line-height: 1.35; }
  .floor-guide span:last-child { color: var(--muted-on-dark); }
  .floor-guide b { color: var(--ink-on-dark); font-weight: 500; }
  html.theme-light .floor-badge { background: #E9DEFB; color: #5B2BB8; }

  /* Talk to Kira: an answer can come with "Show me the way" */
  /* Talk to Kira: one centred column — Kira, what she's saying, one rotating example, then type or talk */
  .voice-center { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 0 24px 12px; text-align: center; }
  .voice-center .kira-stage { gap: 10px; }
  .voice-center .kira-stage .avatar-caption { margin-top: 2px; }
  .tablet-body.bento-home .voice-center .kira-stage .kira-photo-wrap { width: calc(176px * (2.2 - var(--ts)) / 1.2); }
  .voice-center .kira-stage .subtitle-bar { max-width: 640px; padding: 4px 0 0; border-radius: 0; background: none; box-shadow: none; backdrop-filter: none; -webkit-backdrop-filter: none;
    font-size: calc(22px * var(--ts, 1)); font-weight: 500; line-height: 1.35; text-wrap: balance; color: var(--ink-on-dark); }
  .voice-center .voice-side { width: 100%; max-width: 600px; overflow: visible; text-align: center; }
  .voice-center .voice-panel { align-items: center; gap: 22px; }
  .try-line { border: none; background: none; padding: 4px 8px; font: inherit; font-size: calc(16px * var(--ts, 1)); color: var(--muted-on-dark); cursor: pointer; transition: opacity .32s ease, transform .32s ease; }
  .try-line span { color: var(--ink-on-dark); }
  .try-line.out { opacity: 0; transform: translateY(6px); }
  .try-line:disabled { opacity: .4; cursor: default; }
  .voice-compose { display: flex; gap: 10px; width: 100%; }
  .voice-compose .voice-row { flex: 1; min-width: 0; position: relative; }
  .voice-compose .text-field { min-height: 56px; padding-right: 60px; }
  .send-btn { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; border: none; border-radius: 12px; background: var(--brass); color: #FFFFFF; display: grid; place-items: center; cursor: pointer; }
  .send-btn svg { width: 18px; height: 18px; }
  .send-btn:disabled { opacity: .4; cursor: default; }
  .voice-compose .mic-btn { width: auto; flex-shrink: 0; min-height: 56px; padding: 0 22px; border-radius: var(--radius-guest-sm); }
  .voice-answer { display: flex; align-items: center; justify-content: center; gap: 12px; }
  .voice-answer .answer-card { text-align: left; }
  .voice-answer .btn { width: auto; min-height: 56px; border-radius: var(--radius-guest-sm); }

  .answer-card { display: flex; align-items: center; gap: 12px; padding: 10px 14px 10px 10px; border-radius: 18px; background: var(--glass); box-shadow: var(--glass-edge), 0 12px 30px -20px rgba(0,0,0,.8); }
  .answer-card img { width: calc(44px * (2.2 - var(--ts)) / 1.2); height: auto; flex-shrink: 0; filter: drop-shadow(0 6px 8px rgba(0,0,0,.35)); }
  .answer-card .name { font-size: calc(16px * var(--ts, 1)); font-weight: 500; }
  .answer-card .info { font-size: calc(13px * var(--ts, 1)); color: var(--muted-on-dark); margin-top: 2px; }
  html.theme-light .answer-card { box-shadow: var(--glass-edge), 0 10px 26px -16px rgba(60,40,120,.3); }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body class="guest-app">
  <div class="stage" id="stage">
    <div class="tablet-frame app" id="tablet">
      <div class="tablet-context" id="context"></div>
      <div class="tablet-body" id="body"></div>
      <div id="overlay"></div>
    </div>
  </div>
  <p class="rotate-hint">Rotate your phone for a bigger tablet view</p>
<script src="../shared/kira.js?v=5"></script>
<script src="hotel-map.js?v=4"></script>
<script src="public.js?v=11"></script>
<script type="module" src="map3d.js?v=9"></script>
</body>
</html>
